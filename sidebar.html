<!-- R-bloggers の最新記事 -->
<section id="rss-feed">
  <h5 class="quarto-listing-rss-title">Latest from R-bloggers</h5>
  <ul id="rss-items"></ul>
</section>

<script>
  async function fetchRSS() {
    const response = await fetch("https://api.rss2json.com/v1/api.json?rss_url=https://www.r-bloggers.com/feed/");
    const data = await response.json();

    const items = data.items.slice(0, 5); // 最新5件を取得
    let html = "";
    items.forEach(item => {
      html += `<li><a href="${item.link}" target="_blank">${item.title}</a></li>`;
    });

    document.getElementById("rss-items").innerHTML = html;
  }

  fetchRSS();
</script>
